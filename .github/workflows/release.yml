# Builds xnetdb-cli.exe on Linux by cross-compiling to x86_64-pc-windows-gnu.
#
# - Manual run (workflow_dispatch): build only; the executable is available
#   as a workflow artifact.
# - Tag push (v*): build, then publish a GitHub release with the executable.
#   The tag must match the version in Cargo.toml (tag v1.2.3 <-> 1.2.3).
#
# NI-XNET integration tests (feature modify-system-aliases) need the driver
# and are not run here; only the unit tests run.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu
  EXE: target/x86_64-pc-windows-gnu/release/xnetdb-cli.exe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Install MinGW-w64 and Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add "$TARGET"

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Check the executable is standalone
        run: |
          x86_64-w64-mingw32-objdump -p "$EXE" | grep 'DLL Name' | tee imports.txt
          if grep -Ei 'libgcc|libwinpthread|libstdc|nixnet' imports.txt; then
            echo "::error::Unexpected DLL dependency (MinGW runtime or nixnet.dll)"
            exit 1
          fi

      # Apache-2.0 section 4: LICENSE and NOTICE travel with the binary.
      - name: Stage distribution files
        run: |
          mkdir dist
          cp "$EXE" LICENSE NOTICE dist/
          cd dist
          sha256sum xnetdb-cli.exe > xnetdb-cli.exe.sha256
          cat xnetdb-cli.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: xnetdb-cli
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xnetdb-cli

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            xnetdb-cli.exe xnetdb-cli.exe.sha256 LICENSE NOTICE
